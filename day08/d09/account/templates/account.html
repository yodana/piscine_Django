<!DOCTYPE html>
<html>
<head>
    <title>Welcome to Piscine Django</title>
</head>
<body>
    <h1>Welcome to Piscine Django</h1>
    {% if not user.is_authenticated %}
    <form method="post" id="login-user">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Username">
        <input type="password" name="password" placeholder="Password">
        <input type="submit" class="btn btn-primary" value="Submit">
    </form>
    {% endif %}
    {% if user.is_authenticated %}
        <p id="login-name">Logged as {{ user.username }}</p>
        <button id="logout-user" class="btn btn-primary">Logout</button>
    {% else %}
        <p id="login-name" style="display:none;"></p>
        <p id="login-error" style="display:none;"></p>
        <button id="logout-user" class="btn btn-primary" style="display:none;">Logout</button>
    {% endif %}
</body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.0/jquery.min.js"></script>
    <script>
       $(function(){
            $("#login-user").submit(function(e){
                e.preventDefault(); // empêche la page de recharger
                $.ajax({
                    type: "POST",
                    url: "{% url 'account' %}",
                    data: $(this).serialize(),
                    success: function(data){
                    if(data.success){
                            console.log(data)
                            $("#login-user").hide();
                            $("#login-name").text("Logged as " + data.user.username).show();
                            $("#login-error").hide();
                            $("#logout-user").show();
                            console.log(data.user.username);
                    }},
                    error: function(data){
                        $("#login-error").text(data.responseJSON.errors).show();
                    }
                });
            });           
        });
        $(function(){
            $("#logout-user").click(function(e){
                e.preventDefault(); // empêche la page de recharger
                $.ajax({
                    type: "POST",
                    headers: { "X-CSRFToken": "{{ csrf_token }}" },
                    url: "{% url 'logout' %}",
                    data: $(this).serialize(),
                    success: function(data){
                    if(data.success){
                        $("input[name='csrfmiddlewaretoken']").val(data.csrf_token);
                        $("#login-user").show();
                        $("#login-name").hide();
                        $("#login-error").hide();
                        $("#logout-user").hide();
                    }},
                });
            });           
        });
    </script>
</html>
